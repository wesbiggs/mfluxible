[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfluxible-mcp"
description = "An MCP tool that generates images through a running mfluxible server."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Wes Biggs" }]
keywords = ["mcp", "mfluxible", "image-generation", "claude"]

# Matches the server distribution's floor so the two move together, though nothing
# here needs 3.11 specifically -- this package has no config file of its own to parse
# (see below), so tomllib isn't the reason it does for the server.
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

# Deliberately no mflux, no MLX, no PyTorch. This is a client: it makes HTTP calls to a
# server that has all of that, and the whole reason it is a separate distribution
# rather than an `mfluxible[mcp]` extra is that `uvx mfluxible-mcp` on a laptop should
# not install a multi-gigabyte model stack.
dependencies = [
    "mcp>=2.1.1",
    # Declared rather than taken transitively through `mcp`, which ships it today. The
    # module is imported by name in server.py (`from mcp_types import ...`), and "our
    # dependency's dependency happens to provide it" is not a contract to build on --
    # the same call the server distribution makes for `requests`.
    "mcp-types>=2.1.1",
    "httpx>=0.27",
    "Pillow>=10",
]

dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/wesbiggs/mfluxible"
Documentation = "https://github.com/wesbiggs/mfluxible/blob/main/docs/mcp.md"
Source = "https://github.com/wesbiggs/mfluxible"
Issues = "https://github.com/wesbiggs/mfluxible/issues"

[project.scripts]
mfluxible-mcp = "mfluxible_mcp.server:main"

[tool.hatch.version]
path = "mfluxible_mcp/__init__.py"

# Same reasoning as the root pyproject.toml: this file exists to describe a package,
# not to turn clients/ into a uv project. Without it, `cd clients && uv run ...` would
# start syncing a project and writing a lock file.
[tool.uv]
managed = false

[tool.hatch.build.targets.wheel]
packages = ["mfluxible_mcp"]

# README.md here is this package's own, not the repository's -- the root one is about
# running a server, which is not what someone landing on this project's PyPI page is
# installing. The licence is carried as the SPDX expression above rather than a copied
# LICENSE file, since the root one is a directory up and out of this build's reach.
[tool.hatch.build.targets.sdist]
include = ["/mfluxible_mcp", "/README.md"]
