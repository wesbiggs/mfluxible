[pytest]
testpaths = tests
# server/server.py, engine.py, models.py and schemas.py import each other as flat
# sibling modules, not a package (see CLAUDE.md) -- this puts server/ on sys.path the
# same way `uvicorn server:app --app-dir server` does, so tests can `import server`,
# `import engine`, etc. directly.
pythonpath = server
asyncio_mode = auto
