[pytest]
testpaths = tests
# server/server.py, engine.py, models.py and schemas.py import each other as flat
# sibling modules, not a package (see CLAUDE.md) -- this puts server/ on sys.path the
# same way `uvicorn server:app --app-dir server` does, so tests can `import server`,
# `import engine`, etc. directly. clients/ is here for the same reason: an MCP host
# launches mcp_server.py as a script, not as part of a package, so `import mcp_server`
# is how the test suite has to reach it too.
pythonpath = server clients
asyncio_mode = auto
