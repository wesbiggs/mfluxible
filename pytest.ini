[pytest]
testpaths = tests
# `.` puts the repo root on sys.path, so `import mfluxible.engine` resolves to the
# working tree without the package having to be installed first -- a plain `pytest`
# in a checkout tests the code in front of you, not whatever `pip install mfluxible`
# last put in site-packages. That matters for more than convenience: mflux imports
# this package's schedulers *by dotted path* (mfluxible.schedulers.*, see
# schedulers.py), so test_schedulers.py only exercises the real wiring if the name
# it resolves is the working tree's.
#
# clients/ is separate because the MCP client is a second distribution that is not
# installed here either; an MCP host launches it as its own package, and this is how
# the test suite reaches it in a checkout.
pythonpath = . clients
asyncio_mode = auto
