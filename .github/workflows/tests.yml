name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # mlx (mflux's own dependency) only ships wheels for Apple Silicon macOS -- there
    # is no Linux or Intel build -- so this can't run on ubuntu-latest. macos-14 is
    # GitHub's Apple Silicon (M1) runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
