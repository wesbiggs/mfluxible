name: tests

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo -- checkout is the only thing that touches the API,
# and it only reads. Spelled out rather than left to the repo/org default so a later
# default of "write" doesn't silently hand a write-scoped token to every third-party
# action in the job.
permissions:
  contents: read

jobs:
  test:
    # mlx (mflux's own dependency) only ships wheels for Apple Silicon macOS -- there
    # is no Linux or Intel build -- so this can't run on ubuntu-latest. macos-14 is
    # GitHub's Apple Silicon (M1) runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # pip's own wheel cache still has to unpack every wheel (torch, mlx, opencv,
      # transformers, ...) on every run -- that unpacking, not downloading, is what
      # was taking ~30s. uv installs from its cache via APFS clonefile instead of
      # copying, so a cache hit is seconds, not tens of seconds.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            clients/pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    # Deliberately not macos-14: building a wheel runs no project code and needs none
    # of its dependencies, only hatchling, so this is the one job that doesn't need
    # Apple Silicon. It exists to catch packaging breakage on the PR that causes it
    # rather than on the tag that tries to publish it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build both distributions
        run: |
          uv build
          uv build clients/ -o dist-mcp

      # `uv build` builds the wheel from the sdist, so this checks the force-include in
      # pyproject.toml survives that second resolution -- the specific way the harness
      # could go missing. Without it the package installs, starts, generates images,
      # and 500s on its own front page.
      - name: The wheel must carry the harness the server serves at GET /
        run: |
          python -c "
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          if 'mfluxible/harness.html' not in names:
              sys.exit('harness.html is missing from the wheel: ' + repr(sorted(names)))
          print('harness.html present')
          "

      - name: Both distributions must describe themselves correctly
        run: |
          uv tool run twine check dist/* dist-mcp/*
