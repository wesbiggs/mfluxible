name: tests

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo -- checkout is the only thing that touches the API,
# and it only reads. Spelled out rather than left to the repo/org default so a later
# default of "write" doesn't silently hand a write-scoped token to every third-party
# action in the job.
permissions:
  contents: read

jobs:
  test:
    # mlx (mflux's own dependency) only ships wheels for Apple Silicon macOS -- there
    # is no Linux or Intel build -- so this can't run on ubuntu-latest. macos-14 is
    # GitHub's Apple Silicon (M1) runner.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # pip's own wheel cache still has to unpack every wheel (torch, mlx, opencv,
      # transformers, ...) on every run -- that unpacking, not downloading, is what
      # was taking ~30s. uv installs from its cache via APFS clonefile instead of
      # copying, so a cache hit is seconds, not tens of seconds.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: |
            server/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
